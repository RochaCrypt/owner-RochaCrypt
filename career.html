.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:24px}

function state(){try{return JSON.parse(localStorage.getItem('rochacryptCareerJourney'))||{career:'',checks:{},projects:0}}catch(e){return{career:'',checks:{},projects:0}}}
function saveState(v){localStorage.setItem('rochacryptCareerJourney',JSON.stringify(v))}
function progress(){const st=state(),checks=Object.values(st.checks||{}).filter(Boolean).length;return Math.min(100,Math.round((checks/10)*100))}
function buildCareerOS(card){const st=state(),pct=progress();const title=document.createElement('h2');title.className='feature-title';title.textContent=ui==='en'?'Your Career OS':'Seu Career OS';card.appendChild(title);const sub=document.createElement('p');sub.className='feature-sub';sub.textContent=ui==='en'?'Explore, plan, track and prepare for your first opportunity. Progress is saved only in this browser.':'Explore, planeje, acompanhe e prepare-se para a primeira oportunidade. O progresso fica salvo apenas neste navegador.';card.appendChild(sub);const journey=document.createElement('div');journey.className='journey';journey.innerHTML=`<div class="journey-head"><div><h3>${ui==='en'?'My Career Journey':'Minha jornada profissional'}</h3><p>${st.career||(ui==='en'?'No career selected yet':'Nenhuma carreira escolhida')}</p></div><div class="mini-actions"><button class="mini-btn primary" onclick="openJourney()">${ui==='en'?'Open journey':'Abrir jornada'}</button><button class="mini-btn" onclick="openPassport()">${ui==='en'?'Career Passport':'Passaporte profissional'}</button></div></div><div class="journey-bar"><i style="width:${pct}%"></i></div><small>${pct}% ${ui==='en'?'job-ready checklist completed':'do checklist para vagas concluído'}</small>`;card.appendChild(journey);const grid=document.createElement('div');grid.className='feature-grid';const fs=ui==='en'?[['PATHS','Career Explorer','Open detailed roadmaps from beginner to advanced.','explore'],['ABC','Smart Glossary','Understand essential terms in plain language.','glossary'],['PORT','Portfolio Builder','Turn a learning project into a professional README.','portfolio'],['READY','Job Ready','Track the evidence needed before applying.','journey']]:[['TRILHAS','Explorador de carreiras','Abra roteiros detalhados do básico ao avançado.','explore'],['ABC','Glossário inteligente','Entenda termos essenciais em linguagem simples.','glossary'],['PORT','Criador de portfólio','Transforme um projeto em um README profissional.','portfolio'],['VAGAS','Pronto para vagas','Acompanhe as evidências antes de se candidatar.','journey']];fs.forEach(x=>{const b=document.createElement('button');b.className='feature-card';b.innerHTML=`<div class="feature-icon">${x[0]}</div><b>${x[1]}</b><span>${x[2]}</span>`;b.onclick=()=>x[3]==='explore'?document.querySelector('.areas').scrollIntoView({behavior:'smooth'}):x[3]==='glossary'?openGlossary():x[3]==='portfolio'?openPortfolio():openJourney();grid.appendChild(b)});card.appendChild(grid)}

function openJourney(){const st=state(),items=ui==='en'?JOB_EN:JOB_PT;modal(`<h2>${ui==='en'?'My Career Journey':'Minha jornada profissional'}</h2><p>${ui==='en'?'Select a target career and track the milestones required to become job-ready.':'Escolha uma carreira e acompanhe os marcos para ficar pronto para vagas.'}</p><select id="careerSelect" class="career-select"><option value="">${ui==='en'?'Choose a career':'Escolha uma carreira'}</option>${(ui==='en'?AREAS:AREAS_PT).map((a,i)=>`<option value="${AREAS[i][0]}" ${st.career===AREAS[i][0]?'selected':''}>${a[0]}</option>`).join('')}</select><div class="checklist">${items.map((x,i)=>`<label class="check-row"><input type="checkbox" data-job="${i}" ${st.checks&&st.checks[i]?'checked':''}><span><b>${x[0]}</b><small>${x[1]}</small></span></label>`).join('')}</div><div class="mini-actions" style="margin-top:18px"><button class="mini-btn primary" onclick="saveJourney()">${ui==='en'?'Save progress':'Salvar progresso'}</button><button class="mini-btn" onclick="openPassport()">${ui==='en'?'View Career Passport':'Ver passaporte profissional'}</button></div><p class="privacy-note">${ui==='en'?'Privacy: this data is stored locally in your browser and is not sent to RochaCrypt.':'Privacidade: estes dados são armazenados localmente no navegador e não são enviados ao RochaCrypt.'}</p>`)}
function saveJourney(){const st=state();st.career=document.getElementById('careerSelect').value;document.querySelectorAll('[data-job]').forEach(x=>st.checks[x.dataset.job]=x.checked);saveState(st);closeArea();step=-1;render()}
function openGlossary(){const terms=GLOSSARY[ui];modal(`<h2>${ui==='en'?'Smart Glossary':'Glossário inteligente'}</h2><p>${ui==='en'?'Search common technology terms explained for beginners.':'Pesquise termos comuns de tecnologia explicados para iniciantes.'}</p><input id="glossarySearch" class="glossary-search" placeholder="${ui==='en'?'Search a term':'Pesquisar termo'}"><div id="glossaryList" class="glossary-list">${terms.map(x=>`<div class="term"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div>`);document.getElementById('glossarySearch').oninput=function(){const q=this.value.toLowerCase();document.querySelectorAll('.term').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'block':'none')}}

function makeReadme(){const v=id=>(document.getElementById(id).value||'').trim();const title=v('prTitle')||'My Project',problem=v('prProblem'),build=v('prBuild'),tech=v('prTech'),learn=v('prLearn');const txt=`# ${title}\n\n## Problem\n${problem}\n\n## Solution\n${build}\n\n## Technologies\n${tech}\n\n## What I learned\n${learn}\n\n## Next improvements\n- Add tests\n- Improve documentation\n- Review security and accessibility`;document.getElementById('readmeOut').innerHTML=`<h3 style="margin-top:20px">README.md</h3><div class="generated-readme">${esc(txt)}</div><button class="mini-btn" style="margin-top:10px" onclick="navigator.clipboard.writeText(${JSON.stringify(txt)})">${ui==='en'?'Copy README':'Copiar README'}</button>`}
function openPassport(){const st=state(),pct=progress(),items=ui==='en'?JOB_EN:JOB_PT,done=items.filter((x,i)=>st.checks&&st.checks[i]);modal(`<div id="passport" class="passport"><div class="passport-badge">ROCHACRYPT CAREER PASSPORT</div><h2>${st.career||(ui==='en'?'Career not selected':'Carreira não selecionada')}</h2><p>${ui==='en'?'A portable summary of your learning journey.':'Um resumo da sua jornada de aprendizado.'}</p><div class="passport-grid"><div><small>${ui==='en'?'CURRENT PROGRESS':'PROGRESSO ATUAL'}</small><b>${pct}%</b></div><div><small>${ui==='en'?'MILESTONES COMPLETE':'MARCOS CONCLUÍDOS'}</small><b>${done.length}/10</b></div></div><h3>${ui==='en'?'Completed evidence':'Evidências concluídas'}</h3><ul>${done.length?done.map(x=>`<li>${x[0]}</li>`).join(''):`<li>${ui==='en'?'No milestones completed yet.':'Nenhum marco concluído.'}</li>`}</ul></div><div class="mini-actions" style="margin-top:16px"><button class="mini-btn primary" onclick="downloadPassport()">${ui==='en'?'Download Passport PDF':'Baixar passaporte em PDF'}</button><button class="mini-btn" onclick="openJourney()">${ui==='en'?'Update journey':'Atualizar jornada'}</button></div>`)}
function downloadPassport(){html2pdf().set({margin:10,filename:'rochacrypt-career-passport.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(document.getElementById('passport')).save()}

let Q=Q_EN;
const answers={language:"English"};
let step=-1;
const app=document.getElementById('app');

function render(){
  if(step<0){ renderIntro(); return; }
  if(step<Q.length){ renderStep(Q[step]); return; }
  generate();
}
function renderStep(item){
  const pct=Math.round((step/Q.length)*100);
  let body="";
  if(item.type==="text"){
    body=`<input class="txt" id="txt" placeholder="${item.placeholder||''}" value="${answers[item.key]?String(answers[item.key]).replace(/"/g,'&quot;'):''}"/>`;
  } else {
    const sel=answers[item.key];
    body=`<div class="opts">`+item.opts.map(o=>{
      const on=item.type==="multi" ? (Array.isArray(sel)&&sel.includes(o)) : sel===o;
      return `<div class="opt ${item.type==='multi'?'multi':''} ${on?'on':''}" data-o="${o.replace(/"/g,'&quot;')}"><span class="dot"></span><span>${o}</span></div>`;
    }).join("")+`</div>`;
  }
  app.innerHTML=`<div class="card">
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="step">
      <h2>${item.q}</h2>${item.sub?`<div class="sub">${item.sub}</div>`:''}
      ${body}
    </div>
    <div class="nav">
      <button class="btn ghost" id="back">${ui==="en"?"Back":"Voltar"}</button>
      <div class="spacer"></div>
      <button class="btn" id="next">${step===Q.length-1?(ui==="en"?'Generate my plan':'Gerar meu plano'):(ui==="en"?'Next':'Próximo')}</button>
    </div>
  </div>`;

  app.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>{
    const o=el.getAttribute('data-o');
    if(item.type==="multi"){
      const cur=Array.isArray(answers[item.key])?answers[item.key]:[];
      answers[item.key]=cur.includes(o)?cur.filter(x=>x!==o):[...cur,o];
    } else { answers[item.key]=o; }
    renderStep(item);
  }));
  const back=document.getElementById('back'); if(back)back.onclick=()=>{step--;render();};
  document.getElementById('next').onclick=()=>{
    if(item.type==="text"){ const v=document.getElementById('txt').value.trim(); if(v)answers[item.key]=v; }
    // require an answer except optional name
    const optional=item.key==="name";
    const has=item.type==="multi"?(Array.isArray(answers[item.key])&&answers[item.key].length):answers[item.key];
    if(!optional && !has){ /* gently require */ document.getElementById('next').textContent=ui==="en"?"Please pick an option":"Escolha uma opção"; setTimeout(()=>render(),900); return; }
    step++; render();
  };
}

async function generate(){
  app.innerHTML=`<div class="card"><div class="loading"><div class="spin"></div><div>${ui==="en"?"Analysing your answers and building your plan…":"Analisando suas respostas e criando seu plano…"}</div></div></div>`;
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(answers)});
    const raw=await r.text();
    let d={}; try{ d=JSON.parse(raw); }catch(_){ d={ error: (raw||"").slice(0,140) || "The server returned an unexpected response." }; }
    if(!r.ok||!d.plan) throw new Error(d.error||"Could not generate the plan. Please try again.");
    renderReport(d.plan);
  }catch(e){
    app.innerHTML=`<div class="card"><p class="err">${e.message}</p><div class="nav"><button class="btn ghost" id="retry">${ui==="en"?"Try again":"Tentar novamente"}</button></div></div>`;
    document.getElementById('retry').onclick=()=>{step=Q.length;render();};
  }
}

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function list(a){return (Array.isArray(a)?a:[]).map(x=>`<li>${esc(x)}</li>`).join("");}
function pills(a){return (Array.isArray(a)?a:[]).map(x=>`<span class="pill">${esc(x)}</span>`).join("");}

function renderReport(plan){
  const name=answers.name?esc(answers.name):"";
  const areas=(plan.areas||[]).slice(0,3).map(ar=>`
    <div class="area">
      <div class="top"><h3>${esc(ar.name)}</h3><span class="match">${parseInt(ar.match)||''}% match</span></div>
      <div class="bar"><i style="width:${Math.max(0,Math.min(100,parseInt(ar.match)||0))}%"></i></div>
      <div class="why">${esc(ar.why)}</div>
      <h4>Roadmap</h4><ul>${list(ar.steps)}</ul>
      <h4>Certifications</h4><div class="pills">${pills(ar.certifications)}</div>
      <h4>Skills & tools</h4><ul>${list(ar.skills)}</ul>
      ${ar.resources&&ar.resources.length?`<h4>Resources</h4><ul>${list(ar.resources)}</ul>`:''}
    </div>`).join("");

  const html=`<div class="report" id="report">
    <div class="rhead">
      <div class="tag">TECH CAREER PLAN</div>
      <h1>${name?name+"'s career plan":"Your career plan"}</h1>
      <div class="who">${esc(plan.profile||'')}</div>
    </div>
    ${plan.summary?`<div class="summary">${esc(plan.summary)}</div>`:''}
    ${areas}
    ${plan.next90days&&plan.next90days.length?`<div class="n90"><h3>Your first 90 days</h3><ul>${list(plan.next90days)}</ul></div>`:''}
    <div class="rfoot">Generated by Career Compass · rochacrypt · this is guidance, not a guarantee.</div>
  </div>`;

  app.innerHTML=`
    ${html}
    <div class="actions">
      <button class="btn pdf" id="pdf">${ui==="en"?"Download PDF":"Baixar PDF"}</button>
      <button class="btn wa" id="wa">${ui==="en"?"Send to WhatsApp":"Enviar pelo WhatsApp"}</button>
      <button class="btn ghost" id="restart">${ui==="en"?"Start over":"Recomeçar"}</button>
    </div>
    <div class="wa-num"><input class="txt" id="phone" placeholder="${ui==="en"?"Optional: WhatsApp number with country code":"Opcional: número do WhatsApp com código do país"}"/></div>`;

  document.getElementById('pdf').onclick=()=>{
    const el=document.getElementById('report');
    html2pdf().set({margin:8,filename:'career-plan.pdf',image:{type:'jpeg',quality:.98},
      html2canvas:{scale:2,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(el).save();
  };
  document.getElementById('wa').onclick=()=>{
    const top=(plan.areas||[]).slice(0,3).map((a,i)=>`${i+1}. ${a.name} (${parseInt(a.match)||''}%)`).join("\n");
    const certs=((plan.areas||[])[0]?.certifications||[]).slice(0,3).join(", ");
    const msg=`My tech career plan (via Career Compass):\n\n${plan.summary||plan.profile||''}\n\nBest-fit areas:\n${top}\n\nStart with certs like: ${certs}\n\nGenerate yours: ${location.origin}/career.html`;
    const phone=(document.getElementById('phone').value||'').replace(/\D/g,'');
    const url=phone?`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;
    window.open(url,'_blank');
  };
  document.getElementById('restart').onclick=()=>{step=-1;render();};
}


function showArea(idx){const a=(ui==="en"?AREAS:AREAS_PT)[idx], key=AREAS[idx][0], d=DETAILS_EN[key]; const names=ui==="en"?["Beginner","Intermediate","Advanced","Suggested certifications"]:["Iniciante","Intermediário","Avançado","Certificações sugeridas"]; const ptSteps={Beginner:"Construa os fundamentos e pratique tarefas simples.",Intermediate:"Desenvolva competências usadas em vagas e conclua projetos.",Advanced:"Escolha uma especialização e resolva problemas complexos."}; document.getElementById("modalContent").innerHTML=`<h2>${a[0]}</h2><p>${a[1]}</p>`+d.slice(0,3).map((x,i)=>`<div class="road-level"><h3>${names[i]}</h3><p>${ui==='en'?x[1]:ptSteps[x[0]]+' '+x[1]}</p></div>`).join('')+`<div class="cert-box"><h3>${names[3]}</h3>${d[3][1].split(', ').map(x=>`<span>${x}</span>`).join('')}<p style="color:var(--muted);font-size:12px;margin-top:10px">${ui==='en'?'Verify current exam requirements on the official provider website.':'Confirme os requisitos atuais no site oficial de cada instituição.'}</p></div>`;document.getElementById("modalContent").innerHTML += `<div class="mini-actions" style="margin-top:18px"><button class="mini-btn primary" onclick="selectCareer(${idx})">${ui==='en'?'Choose this career':'Escolher esta carreira'}</button></div>`;document.getElementById("areaModal").classList.add("open")}
function selectCareer(idx){const st=state();st.career=AREAS[idx][0];saveState(st);closeArea();step=-1;render()}
function closeArea(){document.getElementById("areaModal").classList.remove("open")}
document.getElementById("uiLang").onclick=function(){ui=ui==="en"?"pt":"en";answers.language=ui==="en"?"English":"Português";Q=ui==="en"?Q_EN:Q_PT;applyUI();step=-1;render()};

applyUI();render();
</script>
</body>
</html>
