  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi,.verdict,.narr,table.scn tr,.disc{break-inside:avoid;page-break-inside:avoid}

/* ===================== DETERMINISTIC ENGINE (13/13 tested) ===================== */
const n = v => (isFinite(+v) ? +v : 0);
function lossMagnitude(c){const sum=(c.responseCost||0)+(c.operationalLoss||0)+(c.revenueLoss||0)+(c.legalRegulatoryCost||0)+(c.reputationCost||0)+(c.longTermCost||0);return Math.max(0,sum-(c.insuranceRecovery||0));}
const ALE=(p,l)=>n(p)*n(l);
function scenario(o){const p0=n(o.annualProbability),L0=n(o.loss);const ale_before=ALE(p0,L0);const p1=Math.max(0,p0*(1-n(o.probReduction)));const L1=Math.max(0,L0*(1-n(o.impactReduction)));const ale_after=ALE(p1,L1);const riskReductionBenefit=Math.max(0,ale_before-ale_after);const netAnnualBenefit=riskReductionBenefit+n(o.additionalOperationalBenefits)-n(o.recurringAnnualSecurityCost);return{ale_before,ale_after,riskReductionBenefit,netAnnualBenefit,residualProbability:p1,residualLoss:L1};}
function tco(inv,years){const initial=(inv.initial||0)+(inv.implementation||0)+(inv.integration||0)+(inv.training||0)+(inv.migration||0)+(inv.infrastructure||0)+(inv.internalLabor||0);const recurring=(inv.recurringAnnual||0)*years;return initial+recurring+(inv.exitCost||0);}
const totalInvestment=inv=>(inv.initial||0)+(inv.implementation||0)+(inv.integration||0)+(inv.training||0)+(inv.migration||0)+(inv.infrastructure||0)+(inv.internalLabor||0);
function rosi(cum,tcoV){if(tcoV<=0)return null;return((cum-tcoV)/tcoV)*100;}
function roi(tb,tcoV){if(tcoV<=0)return null;return((tb-tcoV)/tcoV)*100;}
function paybackMonths(totalInv,net){const m=net/12;if(m<=0)return null;return totalInv/m;}
function npv(init,net,years,rate){let v=-n(init);for(let t=1;t<=years;t++)v+=net/Math.pow(1+rate,t);return v;}
function costOfInaction(aB,aA,years){return(n(aB)-n(aA))*years;}

/* ===================== COMPUTE (conservative / probable / severe) ===================== */
function computeAll(){
  const years=n(A.years),disc=n(A.discountRate)/100;const inv=A.investment;
  const tcoV=tco(inv,years),totalInv=totalInvestment(inv);
  const baseLoss=lossMagnitude(A.costs),baseProb=n(A.annualProbability)/100;
  const probRed=n(A.probReduction)/100,impRed=n(A.impactReduction)/100;
  const add=n(A.additionalBenefits),rec=n(inv.recurringAnnual);
  const BANDS=[{key:"conservative",pMul:0.6,lMul:0.7},{key:"probable",pMul:1.0,lMul:1.0},{key:"severe",pMul:1.4,lMul:1.5}];
  const out={};
  BANDS.forEach(b=>{
    const s=scenario({annualProbability:baseProb*b.pMul,loss:baseLoss*b.lMul,probReduction:probRed,impactReduction:impRed,recurringAnnualSecurityCost:rec,additionalOperationalBenefits:add});
    const cumRisk=s.riskReductionBenefit*years,totalBenefits=(s.riskReductionBenefit+add)*years;
    out[b.key]={ale_before:s.ale_before,ale_after:s.ale_after,riskReductionBenefit:s.riskReductionBenefit,netAnnualBenefit:s.netAnnualBenefit,
      rosi:rosi(cumRisk,tcoV),roi:roi(totalBenefits,tcoV),payback:paybackMonths(totalInv,s.netAnnualBenefit),
      npv:npv(totalInv,s.netAnnualBenefit,years,disc),inaction:costOfInaction(s.ale_before,s.ale_after,years)};
  });
  return{years,tcoV,totalInv,baseLoss,bands:out};
}

const NSTEPS=6;
function render(){
  applyHero();
  if(step<0)return renderIntro();
  if(step===0)return renderOrg();
  if(step===1)return renderThreat();
  if(step===2)return renderCosts();
  if(step===3)return renderInvestment();
  if(step===4)return renderEffectiveness();
  compute();
}
function shell(inner,nextLabel){
  const p=Math.round((step/(NSTEPS-1))*100);
  return `<div class="card"><div class="progress"><i style="width:${p}%"></i></div><div class="step">${inner}</div>
    <div class="nav"><button class="btn ghost" id="back">${t("back")}</button><div class="spacer"></div>
    <button class="btn" id="next">${nextLabel||t("next")}</button></div></div>`;
}

  const inner=`<h2>${t("effTitle")}</h2><div class="sub">${esc(t("effSub"))}</div>
    <label class="lbl">${t("probRedLbl")}</label>
    <div class="rng"><input type="range" id="pr" min="0" max="95" value="${A.probReduction}"/><span class="val mono" id="prv">${A.probReduction}%</span></div>
    <label class="lbl">${t("impRedLbl")}</label>
    <div class="rng"><input type="range" id="ir" min="0" max="95" value="${A.impactReduction}"/><span class="val mono" id="irv">${A.impactReduction}%</span></div>
    <div class="grid2">
      <div><label class="lbl">${t("addBenLbl")}</label><input class="txt num" id="addb" type="number" min="0" step="1000" value="${n(A.additionalBenefits)}"/></div>
      <div><label class="lbl">${t("discLbl")}</label><input class="txt num" id="disc" type="number" min="0" max="40" step="0.5" value="${A.discountRate}"/></div>
    </div>
    <div class="note">${esc(t("effNote"))}</div>`;
  app.innerHTML=shell(inner,t("calcBtn"));
  const pr=document.getElementById('pr'),ir=document.getElementById('ir');
  pr.oninput=()=>{A.probReduction=+pr.value;document.getElementById('prv').textContent=pr.value+"%";};
  ir.oninput=()=>{A.impactReduction=+ir.value;document.getElementById('irv').textContent=ir.value+"%";};
  wireNav(()=>{A.probReduction=+pr.value;A.impactReduction=+ir.value;A.additionalBenefits=n(document.getElementById('addb').value);A.discountRate=n(document.getElementById('disc').value);step=5;render();});
}

/* ===================== RESULTS ===================== */
async function compute(){
  const R=computeAll();
  renderReport(R,null,"loading");
  const b=R.bands.probable;
  const payload={scenarioType:A.scenarioType,sector:A.sectorIdx!=null?I18N.English.sectors[A.sectorIdx]:"unspecified",
    size:A.sizeIdx!=null?I18N.English.sizes[A.sizeIdx]:"unspecified",currency:A.currency,horizon_years:R.years,
    annual_exposure_before:Math.round(b.ale_before),annual_exposure_after_residual:Math.round(b.ale_after),
    annual_risk_reduction_benefit:Math.round(b.riskReductionBenefit),total_initial_investment:Math.round(R.totalInv),
    tco_over_horizon:Math.round(R.tcoV),rosi_percent:b.rosi==null?null:Math.round(b.rosi),roi_percent:b.roi==null?null:Math.round(b.roi),
    payback_months:b.payback==null?null:+b.payback.toFixed(1),npv:Math.round(b.npv),cost_of_inaction_over_horizon:Math.round(b.inaction),
    range:{annual_exposure_before:[Math.round(R.bands.conservative.ale_before),Math.round(R.bands.severe.ale_before)],
      rosi_percent:[R.bands.conservative.rosi==null?null:Math.round(R.bands.conservative.rosi),R.bands.severe.rosi==null?null:Math.round(R.bands.severe.rosi)]}};
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang:A.language,results:payload})});
    const raw=await r.text();let d={};try{d=JSON.parse(raw);}catch(_){}
    if(r.ok&&d.narrative)renderReport(R,d.narrative,"ai");
    else renderReport(R,fallbackNarrative(R),"fallback");
  }catch(e){renderReport(R,fallbackNarrative(R),"fallback");}
}

function fallbackNarrative(R){
  const b=R.bands.probable,yw=yearsWord(R.years);
  const go=b.rosi!=null&&b.rosi>0&&b.payback!=null;
  const pay=b.payback==null?t("fbPayNo"):tt("fbPayAt",{m:months(b.payback)});
  return{
    headline:go?tt("fbHeadGo",{rosi:pct(b.rosi),years:yw,after:money(b.ale_after)}):t("fbHeadNo"),
    narrative:tt("fbNarr",{before:money(b.ale_before),after:money(b.ale_after),tco:money(R.tcoV),years:yw,rosi:pct(b.rosi,true),pay:pay,inaction:money(b.inaction)}),
    drivers:D().fbD.slice(),
    recommendation:go?t("fbRecGo"):t("fbRecNo"),
    caveats:D().fbC.slice()
  };
}

function kpi(lab,val,cls,sub){return `<div class="kpi"><div class="lab">${lab}</div><div class="v ${cls||''}">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;}

function renderReport(R,narr,mode){
  const b=R.bands.probable,c=R.bands.conservative,s=R.bands.severe;
  const sizeLabel=A.sizeIdx!=null?D().sizes[A.sizeIdx]:"";
  const sectorLabel=A.sectorIdx!=null?D().sectors[A.sectorIdx]:"";
  const who=[A.orgName,sectorLabel,sizeLabel].filter(Boolean).join(" · ")||t("anon");
  const vclass=b.rosi!=null&&b.rosi>0&&b.payback!=null?"go":(b.rosi!=null&&b.rosi>-40?"cond":"no");
  const vlabel=vclass==="go"?t("recRecommended"):(vclass==="cond"?t("recConditional"):t("recNot"));
  const scLabel=A.scenarioType?D().scn[A.scenarioType]:t("securityWord");

  const rows=[[t("rConservative"),c],[t("rProbable"),b,true],[t("rSevere"),s]].map(([lab,x,base])=>`
    <tr class="${base?'base':''}"><td>${lab}</td><td class="mono">${money(x.ale_before)}</td><td class="mono">${money(x.ale_after)}</td>
    <td class="mono">${pct(x.rosi,true)}</td><td class="mono">${months(x.payback)}</td><td class="mono">${money(x.npv)}</td></tr>`).join("");

  let narrBlock="";
  if(mode==="loading"){narrBlock=`<div class="narr"><div class="loading" style="padding:20px 0"><div class="spin"></div><div>${t("loadingSummary")}</div></div></div>`;}
  else if(narr){
    const badge=mode==="ai"?`<span class="nvidia">${t("aiVia")}</span>`:``;
    narrBlock=`<div class="verdict ${vclass}"><b>${t("bottomLine")} ${badge}</b>${esc(narr.headline||"")}</div>
      <div class="narr"><h3>${t("execSummary")}</h3><p>${esc(narr.narrative||"")}</p>
      ${narr.drivers&&narr.drivers.length?`<h4>${t("mainDrivers")}</h4><ul>${listHtml(narr.drivers)}</ul>`:''}
      <h4>${t("recommendation")} (${vlabel})</h4><p style="margin-bottom:0">${esc(narr.recommendation||"")}</p>
      ${narr.caveats&&narr.caveats.length?`<h4>${t("caveats")}</h4><ul>${listHtml(narr.caveats)}</ul>`:''}</div>`;
  }

  const html=`<div class="report" id="report">
    <div class="rhead"><div class="tag">${t("rTag")}</div>
      <h1>${esc(tt("rTitle",{s:scLabel}))}</h1>
      <div class="who">${esc(who)} · ${esc(tt("horizonWord",{y:yearsWord(A.years)}))} · ${A.currency}</div></div>
    ${narrBlock}
    <div class="sec-h">${t("headline")}</div>
    <div class="kpis">
      ${kpi(t("kBefore"),money(b.ale_before),"neg")}
      ${kpi(t("kAfter"),money(b.ale_after),"")}
      ${kpi(t("kReduced"),money(b.riskReductionBenefit),"pos")}
      ${kpi(t("kTco"),money(R.tcoV),"",tt("oneoff",{v:money(R.totalInv)}))}
      ${kpi(t("kRosi"),pct(b.rosi,true),b.rosi!=null&&b.rosi>=0?"pos":"neg",tt("overN",{y:yearsWord(R.years)}))}
      ${kpi(t("kPayback"),months(b.payback),b.payback!=null?"pos":"neg")}
      ${kpi(t("kNpv"),money(b.npv),b.npv>=0?"pos":"neg",tt("atDisc",{d:A.discountRate}))}
      ${kpi(t("kRoi"),pct(b.roi,true),b.roi!=null&&b.roi>=0?"pos":"neg")}
      ${kpi(t("kInaction"),money(b.inaction),"neg",t("inactionSub"))}
    </div>
    <div class="sec-h">${t("scnRange")}</div>
    <table class="scn"><thead><tr><th>${t("cScenario")}</th><th>${t("cBefore")}</th><th>${t("cAfter")}</th><th>${t("cRosi")}</th><th>${t("cPayback")}</th><th>${t("cNpv")}</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="disc">${esc(t("disclaimer"))}</div>
    <div class="rfoot">${esc(tt("footer",{d:new Date().toLocaleDateString(LOCALE[A.language]||"en-US")}))}</div>
  </div>`;

  app.innerHTML=html+`<div class="actions">
      <button class="btn pdf" id="pdf">${t("savePdf")}</button>
      <button class="btn wa" id="wa">${t("share")}</button>
      <button class="btn ghost" id="edit">${t("edit")}</button>
      <button class="btn ghost" id="restart">${t("restart")}</button>
    </div><div class="note">${esc(t("pdfHint"))}</div>`;

  document.getElementById('pdf').onclick=()=>{window.print();};
  document.getElementById('wa').onclick=()=>{
    const msg=`${t("waTitle")} (${scLabel}):\n`+
      `${t("waExposure")}: ${money(b.ale_before)} -> ${money(b.ale_after)}\n`+
      `${tt("waInvest",{y:yearsWord(A.years)})}: ${money(R.tcoV)}\n`+
      `ROSI: ${pct(b.rosi,true)} | Payback: ${months(b.payback)} | ${t("kNpv")}: ${money(b.npv)}\n`+
      `${t("waInaction")}: ${money(b.inaction)}\n\n${t("waBuilt")} ${location.origin}/incident.html`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
  };
  document.getElementById('edit').onclick=()=>{step=4;render();};
  document.getElementById('restart').onclick=()=>{step=-1;render();};
}

render();
</script>
</body>
</html>
